name: Generate SHA-256 manifest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-checksums:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          mkdir -p checksums

          {
            find data/published -type f -print0
            find powerworld/cases -type f -print0
            printf '%s\0' powerworld/CASE_INDEX.csv
          } \
          | sort -z \
          | xargs -0 sha256sum \
          > checksums/REFERENCE_SHA256SUMS.txt

          echo "Generated SHA-256 manifest:"
          cat checksums/REFERENCE_SHA256SUMS.txt

      - name: Commit checksum manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add checksums/REFERENCE_SHA256SUMS.txt

          if git diff --cached --quiet; then
            echo "Checksum manifest is already up to date."
          else
            git commit -m "Generate SHA-256 manifest for published data and PowerWorld cases"
            git push
          fi
